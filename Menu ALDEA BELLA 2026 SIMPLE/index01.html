<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Bar el de Abella</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #121212;
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #a0a0a0;
        }

        .menu-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-page {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a2a2a;
        }

        .menu-page img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #777;
            padding: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .menu-container {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>BAR EL DE ABELLA</h1>
        <p class="subtitle">Nuestra Carta</p>
    </header>

    <main class="menu-container">
        <!-- Página 1 del menú -->
        <article class="menu-page">
            <img src="pagina1.png" alt="Carta del Menú - Página 1" loading="lazy">
        </article>

        <!-- Página 2 del menú -->
        <article class="menu-page">
            <img src="pagina2.png" alt="Carta del Menú - Página 2" loading="lazy">
        </article>
    </main>

    <footer>
        <p>© Bar el de Abella · Todos los derechos reservados</p>
    </footer>

</body>
</html>
