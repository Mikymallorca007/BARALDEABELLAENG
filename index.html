<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA - Menú</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent-gold: #d4af37;
            --text-primary: #ffffff;
            --text-secondary: #a0a0aa;
            --border-color: #2e2e36;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 40px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .lang-selector {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: none; border: none; font-size: 1.3rem; cursor: pointer;
            opacity: 0.5; transition: 0.2s;
        }
        .lang-btn.active { opacity: 1; transform: scale(1.15); }

        .brand-title {
            font-size: 2rem; font-weight: 800; color: var(--accent-gold);
            letter-spacing: 2px; text-transform: uppercase; margin-top: 15px;
        }

        .page-selector {
            display: flex; background-color: var(--card-bg); padding: 5px;
            border-radius: 30px; border: 1px solid var(--border-color);
            margin-bottom: 25px; gap: 5px;
        }

        .tab-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 10px 24px; font-weight: 600; border-radius: 25px; cursor: pointer;
        }
        .tab-btn.active { background-color: var(--accent-gold); color: #000; }

        .menu-viewer { width: 100%; max-width: 800px; }
        .page-content { display: none; width: 100%; }
        .page-content.active { display: block; }
        .page-content img { width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--border-color); }

        footer { margin-top: 40px; color: var(--text-secondary); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLanguage('es')">🇪🇸</button>
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧</button>
        </div>
        <h1 class="brand-title">BAR ALDEA BELLA</h1>
        <p id="subtitle-text">NUESTRA CARTA</p>
    </header>

    <nav class="page-selector">
        <button class="tab-btn active" id="btn-page1" onclick="showPage(1)">Página 1</button>
        <button class="tab-btn" id="btn-page2" onclick="showPage(2)">Página 2</button>
    </nav>

    <main class="menu-viewer">
        <article class="page-content active" id="page-1">
            <!-- ID único para cambiar la imagen vía JS -->
            <img id="img-p1" src="pagina1_ESP.png" alt="Menú Página 1">
        </article>

        <article class="page-content" id="page-2">
            <!-- ID único para cambiar la imagen vía JS -->
            <img id="img-p2" src="pagina2_ESP.png" alt="Menú Página 2">
        </article>
    </main>

    <footer><p>© BAR ALDEA BELLA</p></footer>

    <script>
        function showPage(pageNumber) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageNumber).classList.add('active');
            document.getElementById('btn-page' + pageNumber).classList.add('active');
        }

        function setLanguage(lang) {
            const btnEs = document.querySelectorAll('.lang-btn')[0];
            const btnEn = document.querySelectorAll('.lang-btn')[1];
            const subtitle = document.getElementById('subtitle-text');
            const btnPage1 = document.getElementById('btn-page1');
            const btnPage2 = document.getElementById('btn-page2');
            
            // Elementos de imagen
            const img1 = document.getElementById('img-p1');
            const img2 = document.getElementById('img-p2');

            if (lang === 'en') {
                btnEs.classList.remove('active'); btnEn.classList.add('active');
                subtitle.textContent = "OUR MENU";
                btnPage1.textContent = "Page 1"; btnPage2.textContent = "Page 2";
                // Cambiar imágenes a versión ENG
                img1.src = 'pagina1_ENG.png';
                img2.src = 'pagina2_ENG.png';
            } else {
                btnEn.classList.remove('active'); btnEs.classList.add('active');
                subtitle.textContent = "NUESTRA CARTA";
                btnPage1.textContent = "Página 1"; btnPage2.textContent = "Página 2";
                // Cambiar imágenes a versión ESP
                img1.src = 'pagina1_ESP.png';
                img2.src = 'pagina2_ESP.png';
            }
        }
    </script>
</body>
</html>
